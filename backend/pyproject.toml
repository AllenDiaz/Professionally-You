[project]
name = "professionally-you-backend"
version = "0.1.0"
description = "FastAPI backend for the Professionally-You AI career chatbot"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.5.0",
    "openai>=1.85.0",
    "google-auth>=2.35.0",
    "numpy>=1.26.0",
    "pypdf>=5.6.0",
    "requests>=2.32.0",
    "certifi>=2025.4.26",
    "python-dotenv>=1.1.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "slowapi>=0.1.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
